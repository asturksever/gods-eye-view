<!-- Mapillary street-level dock: AI query, results, filters and the embedded
       viewer. Self-contained (not part of the left panel stack) so the
       integration stays isolated from the rail layout engine. -->
<section
  id="mapillary-dock"
  class="mly-dock"
  data-mly-dock
  aria-label="Mapillary street level"
>
  <div class="panel-glow"></div>
  <!-- Shown instead of the panel while it is minimized. -->
  <button
    id="mly-minimized"
    class="mly-minimized"
    type="button"
    title="Open Mapillary"
    aria-label="Open the Mapillary panel"
    hidden
  >
    <svg
      class="mly-logo"
      viewBox="0 0 13.5 13.8"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
    >
      <path
        fill="currentColor"
        d="M6.38154274 9.6505067C6.14007412 9.52786404 6.08124006 9.31709453 6.21044037 9.08865565 6.27614941 8.97247561 6.41859234 8.74074422 6.53468168 8.5539822 6.69432724 8.29714786 6.92701434 8.29637588 7.05835866 8.37253362 7.18970298 8.44869135 9.04853604 9.42087063 9.16874871 9.48670656 9.4525926 9.64215711 9.87118629 9.28623741 9.68342251 8.97441326 9.59375332 8.82549731 8.8103938 7.4044783 8.5614978 6.93610438 8.44825156 6.72299696 8.47921005 6.53132251 8.731647 6.40377463 8.85656436 6.3406581 9.08004239 6.20890798 9.27394762 6.09190586 9.47189219 5.9724664 9.7353488 6.06223885 9.84245555 6.24022621 9.94956229 6.41821357 13.1209182 12.2294019 13.2221517 12.4098169 13.4231294 12.7679928 13.0322853 13.1511137 12.662949 12.953094 12.4781436 12.8540105 6.62301136 9.77314936 6.38154274 9.6505067zM.200146062 6.40081205C-.111554282 6.23274106-.0545442328 5.79604052.338782648 5.68466036.672030083 5.59029317 3.37820647 4.6882634 4.19715115 4.4149007 4.34479443 4.36561757 4.46005809 4.25228232 4.50965757 4.1075867 4.78858853 3.29386671 5.72024556.575961334 5.82468911.27126979 5.9477048-.087601979 6.39304077-.0889184867 6.57454671.258502251 6.63901566.381902346 9.08940484 4.79813543 9.17465946 4.98547051 9.25991408 5.17280559 9.20498731 5.38031434 9.01176406 5.50000515 8.8185408 5.61969596 8.50343522 5.79872065 8.3936507 5.86654323 8.19489463 5.98933057 8.00439135 5.90384324 7.91365501 5.71364816 7.82291866 5.52345307 7.12387828 4.29626886 6.83882952 3.77527795 6.69634941 3.51486341 6.2671132 3.41492796 6.12283721 3.83582159 6.01848488 4.14024669 5.77526264 4.84979439 5.64864557 5.219172 5.60020375 5.3604904 5.47741944 5.48212554 5.33398124 5.52937001 4.9780163 5.64661478 4.30162944 5.86939744 3.90672375 5.99946818 3.62491469 6.0922881 3.48793523 6.52150257 3.86841776 6.70224674 3.94789525 6.74000167 5.66097153 7.65404391 5.83772054 7.73764558 6.01446954 7.82124724 6.11275281 8.06257945 6.00925316 8.23355004 5.8680804 8.46675268 5.68734796 8.76272052 5.6217862 8.85880815 5.50815838 9.02534163 5.28495077 9.08080286 5.09748996 8.98251076 4.91002915 8.88421866.311522289 6.46086689.200146062 6.40081205z"
      />
    </svg>
    <span id="mly-minimized-badge" class="mly-minimized-badge" hidden></span>
  </button>
  <div class="mly-dock-inner">
    <header class="mly-header">
      <button
        id="mly-dock-toggle"
        class="mly-title-btn"
        type="button"
        aria-expanded="true"
        aria-controls="mly-body"
        title="Collapse Mapillary · drag the header to move the window, double-click to snap it back"
      >
        <span class="mly-brand-dot" aria-hidden="true"></span>
        <span class="mly-title">MAPILLARY</span>
        <span id="mly-status-chip" class="mly-chip" aria-live="polite"
          >OFF</span
        >
      </button>
      <div class="mly-header-tools">
        <button
          id="mly-enable-btn"
          class="mly-power"
          type="button"
          aria-pressed="false"
          title="Toggle the Street Level layer"
        >
          STREET LEVEL OFF
        </button>
        <button
          id="mly-minimize-btn"
          class="mly-icon-btn"
          type="button"
          title="Minimize Mapillary to its logo"
          aria-label="Minimize the Mapillary panel"
        >
          <span aria-hidden="true">—</span>
        </button>
      </div>
    </header>
    <div id="mly-body" class="mly-body">
      <div class="mly-scroll">
        <form id="mly-query-form" class="mly-query" autocomplete="off">
          <div class="mly-ai-head">
            <span class="mly-ai-pulse" aria-hidden="true"></span>
            <label for="mly-query-input" class="mly-kicker"
              >ASK MAPILLARY AI</label
            >
            <span id="mly-ai-model" class="mly-ai-model"></span>
          </div>
          <div class="mly-query-row">
            <input
              id="mly-query-input"
              type="text"
              maxlength="600"
              spellcheck="false"
              placeholder="Type a question, e.g. show me all fire hydrants in Sacramento"
              aria-label="Ask Mapillary AI"
            />
            <button id="mly-query-run" class="mly-ask" type="submit">
              ASK
            </button>
          </div>
          <p id="mly-ai-hint" class="mly-ai-hint">
            Type what you want to see in plain English — objects, traffic signs,
            coverage or a street view of any place — and press Enter. Follow-ups
            refine the last answer.
          </p>
          <div
            class="mly-suggestions"
            role="group"
            aria-label="Example queries"
          >
            <button
              type="button"
              class="mly-suggestion"
              data-mly-suggestion="show me all fire hydrants in Sacramento"
            >
              Hydrants · Sacramento
            </button>
            <button
              type="button"
              class="mly-suggestion"
              data-mly-suggestion="stop signs in downtown Detroit"
            >
              Stop signs · Detroit
            </button>
            <button
              type="button"
              class="mly-suggestion"
              data-mly-suggestion="street lights and utility poles around here"
            >
              Street lights · here
            </button>
            <button
              type="button"
              class="mly-suggestion"
              data-mly-suggestion="show me a 360 street view here"
            >
              360° view · here
            </button>
          </div>
        </form>
        <div
          id="mly-answer"
          class="mly-answer"
          role="status"
          aria-live="polite"
        >
          Turn on Street Level to see Mapillary coverage, then ask for anything
          that appears in street imagery.
        </div>
        <div id="mly-progress" class="mly-progress" hidden>
          <div id="mly-progress-fill" class="mly-progress-fill"></div>
          <span id="mly-progress-label" class="mly-progress-label"></span>
        </div>
        <div id="mly-results" class="mly-results" hidden>
          <div id="mly-result-chips" class="mly-chips"></div>
          <div class="mly-actions">
            <button id="mly-frame-btn" class="scene-btn" type="button">
              FRAME
            </button>
            <button
              id="mly-3d-btn"
              class="scene-btn"
              type="button"
              aria-pressed="false"
              title="Stand the results up as 3D objects (small result sets)"
            >
              3D OBJECTS OFF
            </button>
            <button id="mly-clear-btn" class="scene-btn" type="button">
              CLEAR
            </button>
          </div>
          <div id="mly-3d-note" class="mly-meta" hidden></div>
        </div>
        <div class="mly-filters" role="group" aria-label="Imagery filters">
          <span class="mly-filter-label">IMAGERY</span>
          <div class="mly-seg" role="radiogroup" aria-label="Panorama filter">
            <button
              type="button"
              class="mly-seg-btn is-active"
              data-mly-pano="all"
              role="radio"
              aria-checked="true"
            >
              ALL
            </button>
            <button
              type="button"
              class="mly-seg-btn"
              data-mly-pano="pano"
              role="radio"
              aria-checked="false"
            >
              360°
            </button>
            <button
              type="button"
              class="mly-seg-btn"
              data-mly-pano="flat"
              role="radio"
              aria-checked="false"
            >
              FLAT
            </button>
          </div>
          <label class="mly-filter-label" for="mly-since">SINCE</label>
          <select
            id="mly-since"
            class="mly-select"
            aria-label="Show imagery captured since"
          >
            <option value="0">any date</option>
            <option value="365">last year</option>
            <option value="730">2 years</option>
            <option value="1826">5 years</option>
            <option value="year:2024">2024</option>
            <option value="year:2022">2022</option>
            <option value="year:2020">2020</option>
          </select>
        </div>
        <div class="mly-actions mly-street-actions">
          <button
            id="mly-look-btn"
            class="scene-btn"
            type="button"
            title="Open the nearest Mapillary image to the view centre"
          >
            LOOK HERE
          </button>
          <button
            id="mly-follow-btn"
            class="scene-btn"
            type="button"
            aria-pressed="false"
            title="Drive the globe camera from the street-level view"
          >
            STREET COCKPIT OFF
          </button>
          <button
            id="mly-photoreal-btn"
            class="scene-btn"
            type="button"
            aria-pressed="false"
            title="Switch the globe to Google Photorealistic 3D Tiles (needs a Google Maps key or Cesium ion token)"
          >
            GOOGLE 3D
          </button>
        </div>
        <div id="mly-coverage-meta" class="mly-meta"></div>
      </div>
      <!-- The viewer sits outside the scroll region so the imagery is always
           fully on screen; it grows with the window. -->
      <div id="mly-viewer-wrap" class="mly-viewer-wrap" hidden>
        <div class="mly-viewer-tools">
          <button
            id="mly-viewer-expand"
            class="scene-btn"
            type="button"
            aria-pressed="false"
            title="Expand the street-level view (Esc shrinks it)"
          >
            <span class="mly-btn-icon" aria-hidden="true">⤢</span>
            <span class="mly-btn-text">EXPAND</span>
          </button>
          <button
            id="mly-viewer-fit"
            class="scene-btn"
            type="button"
            title="FIT shows the whole image; FILL crops it to the frame"
          >
            FIT
          </button>
        </div>
        <div class="mly-viewer-tools mly-viewer-tools-right">
          <button
            id="mly-viewer-close"
            class="mly-viewer-x"
            type="button"
            title="Close the image and deselect it on the map"
            aria-label="Close the street-level image"
          >
            ×
          </button>
        </div>
        <div
          id="mly-viewer"
          class="mly-viewer"
          aria-label="Mapillary street-level viewer"
        ></div>
        <div id="mly-image-meta" class="mly-image-meta">
          <span id="mly-image-by" class="mly-image-by"></span>
          <span class="mly-image-right">
            <span id="mly-image-when" class="mly-image-when"></span>
            <a
              id="mly-image-link"
              class="mly-image-link"
              href="https://www.mapillary.com/app/"
              target="_blank"
              rel="noopener noreferrer"
              title="Open this image on mapillary.com"
              >MAPILLARY ↗</a
            >
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
